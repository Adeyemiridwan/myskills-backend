{% extends "base.html" %}
{% block title %}Edit Skill{% endblock %}

{% block content %}
<div class="card">

  <h2>Edit Skill</h2>
  <p>Update your skill details</p>

  <form method="POST">
    {{ form.hidden_tag() }}

    <label>{{ form.title.label }}</label>
    {{ form.title() }}

    <label>{{ form.level.label }}</label>
    {{ form.level() }}

    <label>{{ form.description.label }}</label>
    {{ form.description(rows=4) }}

    <label>{{ form.category_id.label }}</label>
    {{ form.category_id() }}

    <button type="submit">Update Skill</button>
  </form>

  <br>
  <a href="{{ url_for('profile.dashboard') }}">Back to Dashboard</a>

</div>
{% endblock %}
