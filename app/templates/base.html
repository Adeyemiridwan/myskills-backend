<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MySkills{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/css/styles.css" type="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome-free-7.1.0-web/css/all.min.css') }}">
  <style>
      * {
          box-sizing: border-box;
      }

      body {
          font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont;
          background: linear-gradient(135deg, #0f172a, #020617);
          min-height: 100vh;
          margin: 0;
          padding: 0;
          color: #e5e7eb;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .container {
          width: 100%;
          max-width: 420px;
          padding: 25px;
      }

      .card {
          background: rgba(15, 23, 42, 0.95);
          border-radius: 14px;
          padding: 30px;
          box-shadow: 0 25px 50px rgba(0,0,0,0.6);
          animation: fadeIn 0.6s ease-in-out;
      }

      h1, h2 {
          margin-bottom: 8px;
          font-weight: 600;
      }

      p {
          color: #9ca3af;
          font-size: 14px;
          margin-bottom: 20px;
      }

      label {
          font-size: 13px;
          margin-bottom: 6px;
          display: block;
          color: #cbd5f5;
      }

      input, select, textarea {
          width: 100%;
          padding: 12px;
          margin-bottom: 16px;
          border-radius: 8px;
          border: 1px solid #1e293b;
          background: #020617;
          color: #e5e7eb;
          outline: none;
          transition: border 0.2s;
      }

      input:focus {
          border-color: #6366f1;
      }

      .btn,
      input[type="submit"],
      button {
          width: 100%;
          padding: 12px;
          border: none;
          border-radius: 8px;
          background: linear-gradient(135deg, #6366f1, #4f46e5);
          color: white;
          font-weight: 600;
          cursor: pointer;
          transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover,
      input[type="submit"]:hover {
          transform: translateY(-1px);
          box-shadow: 0 10px 25px rgba(99,102,241,0.4);
      }

      a {
          color: #818cf8;
          text-decoration: none;
          font-size: 14px;
      }

      a:hover {
          text-decoration: underline;
      }

      .alert {
          padding: 12px;
          border-radius: 8px;
          margin-bottom: 16px;
          font-size: 14px;
      }

      .alert-success {
          background: rgba(34,197,94,0.15);
          color: #22c55e;
      }

      .alert-danger {
          background: rgba(239,68,68,0.15);
          color: #ef4444;
      }

      .alert-info {
          background: rgba(59,130,246,0.15);
          color: #3b82f6;
      }

      @keyframes fadeIn {
          from {
              opacity: 0;
              transform: translateY(8px);
          }
          to {
              opacity: 1;
              transform: translateY(0);
          }
      }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .skill-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
    }

    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skill-title {
      font-weight: 600;
      font-size: 15px;
      color: #e5e7eb;
    }

    .badge {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 999px;
      background: #1e293b;
      color: #93c5fd;
    }

    .skill-level {
      margin-top: 8px;
      font-size: 13px;
      color: #cbd5f5;
    }

    .skill-desc {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }

    .skill-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .skill-actions a,
    .skill-actions button {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .btn-edit {
      background: #1d4ed8;
      color: white;
    }

    .btn-delete {
      background: #7f1d1d;
      color: white;
    }

    .activity-list {
      margin-top: 20px;
      border-left: 2px solid #1e293b;
      padding-left: 20px;
    }

  .activity-item {
    position: relative;
    margin-bottom: 20px;
    }

  .activity-item::before {
    content: "";
    position: absolute;
    left: -11px;
    top: 4px;
    width: 10px;
    height: 10px;
    background: #3b82f6;
    border-radius: 50%;
  }

  .activity-action {
    font-weight: 500;
    color: #e5e7eb;
  }

  .activity-time {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
  }


  .password-group {
    position: relative;
  }

  .password-input {
    width: 100%;
    padding-right: 44px; /* space for the eye */
  }

  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #94a3b8;
    font-size: 16px;
    user-select: none;
  }

  .password-toggle:hover {
    color: #c7d2fe;
  }

</style>



</head>
<body>
    <div class="container">

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Page content -->
        {% block content %}{% endblock %}

    </div>


  <script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".password-toggle").forEach(icon => {
      icon.addEventListener("click", () => {
        const input = icon.previousElementSibling;

        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      });
    });
  });
  </script>


</body>


</html>
