{% extends "base.html" %}
{% block title %}Update Profile{% endblock %}

{% block content %}
<div class="card">

  <h2>Update Profile</h2>
  <p>Edit your account details</p>

  <form method="POST">
    {{ form.hidden_tag() }}

    <label>{{ form.username.label }}</label>
    {{ form.username() }}

    <label>{{ form.email.label }}</label>
    {{ form.email() }}

    {{ form.submit() }}
  </form>

  <br>
  <a href="{{ url_for('profile.dashboard') }}">Back to Dashboard</a>

</div>
{% endblock %}
